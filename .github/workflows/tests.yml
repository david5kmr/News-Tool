name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: sources.yaml validieren
        run: python -c "from pathlib import Path; from mi.sources import load; r=load(Path('sources.yaml')); print(len(r.sources), 'Quellen ok')"

      - name: CLI erreichbar
        run: mi preflight || true
