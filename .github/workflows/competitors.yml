name: Wettbewerber-Check

on:
  schedule:
    - cron: "0 7 * * 1"   # montags
  workflow_dispatch:

concurrency:
  group: mi-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MI_DB_PATH: data/mi.db
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MI_MAIL_BACKEND: ${{ vars.MI_MAIL_BACKEND || 'resend' }}
      MI_MAIL_FROM: ${{ secrets.MI_MAIL_FROM }}
      MI_MAIL_TO: ${{ secrets.MI_MAIL_TO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Archiv holen
        run: scripts/db_sync.sh restore

      - name: Wettbewerberseiten diffen
        run: python -m mi competitors

      - name: Woechentliche Quellen sammeln
        run: python -m mi collect --cadence weekly

      - name: Archiv sichern
        if: always()
        run: scripts/db_sync.sh save
