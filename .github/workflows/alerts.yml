name: Sofort-Alerts

on:
  schedule:
    # Alle zwei Stunden zwischen 08:00 und 20:00 CET (UTC-Fenster grosszuegig
    # gewaehlt, damit es Sommer wie Winter passt).
    - cron: "0 6,8,10,12,14,16,18 * * *"
  workflow_dispatch:

concurrency:
  group: mi-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MI_DB_PATH: data/mi.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MI_MAIL_BACKEND: ${{ vars.MI_MAIL_BACKEND || 'resend' }}
      MI_MAIL_FROM: ${{ secrets.MI_MAIL_FROM }}
      MI_MAIL_TO: ${{ secrets.MI_MAIL_TO }}
      MI_ALERT_MIN_SCORE: ${{ vars.MI_ALERT_MIN_SCORE || '8' }}
      MI_MAX_ALERTS_PER_DAY: ${{ vars.MI_MAX_ALERTS_PER_DAY || '3' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vorflugkontrolle
        id: pre
        run: |
          set -o pipefail
          if python -m mi preflight --require sources,anthropic,mail | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archiv holen
        if: steps.pre.outputs.ready == 'true'
        run: scripts/db_sync.sh restore

      - name: Alert-Quellen sammeln
        if: steps.pre.outputs.ready == 'true'
        run: python -m mi collect --cadence alerts

      - name: Bewerten
        if: steps.pre.outputs.ready == 'true'
        run: python -m mi prefilter --limit 100

      - name: Trigger pruefen
        if: steps.pre.outputs.ready == 'true'
        run: python -m mi alerts

      - name: Archiv sichern
        if: always() && steps.pre.outputs.ready == 'true'
        run: scripts/db_sync.sh save
