# Quellenregister des Market-Intelligence-Systems.
#
# WICHTIG — Bauschritt 1 ist noch NICHT abgeschlossen.
# Jede Quelle traegt `status: unverified`. Die URLs unter `candidates` sind
# begruendete Kandidaten, KEINE geprueften Feeds. Erst `mi verify-sources`
# probiert sie durch (plus Autodiscovery ueber die `homepage`), schreibt die
# funktionierende URL nach `url` und setzt `status: verified`.
#
# Der Collector ueberspringt unverifizierte Quellen standardmaessig. Wer es
# eilig hat: `mi collect --allow-unverified` — aber dann steht im Log, welche
# Quelle geraten war.
#
# status: unverified | verified | no_feed | broken | manual
# kind:   rss | html | google_news | website_diff
# cadence: daily | alerts | weekly

version: 1

defaults:
  timeout: 20
  user_agent: "MarketIntelligenceBot/0.1 (+Marktbeobachtung Gesundheitswesen; Kontakt siehe README)"
  cadence: daily
  max_items_per_run: 40

